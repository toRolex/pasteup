[package]
name = "pasteup"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "手帐剪纸拼贴绘图 app：照片描摹 → 纸片元素 → 拼贴排版 → 导出 PNG/SVG"
authors = ["pasteup"]
edition = "2021"

[lib]
name = "pasteup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
# T12 自动保存/打开项目：文件对话框 + 文件读写
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# macOS 原生 NSColorSampler（屏幕取色，T15）。仅 macOS 编译，避免 Windows 交叉编译负担。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColorSampler", "NSColor", "NSColorSpace", "block2"] }
objc2-core-foundation = "0.3"

# Windows 覆盖层取色：全屏截屏（T17）。仅 Windows 编译；macOS 侧只做依赖解析（Cargo.lock），不编译。
[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
