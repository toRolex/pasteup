<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pasteup · 深夜拼贴桌</title>
  <meta name="description" content="pasteup 深夜拼贴桌 — 台灯光锥下的手帐剪纸拼贴桌面。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Ccircle cx='14' cy='14' r='11' fill='%232B241C'/%3E%3Cpath d='M14 6c2.6.7 4.4 2.5 4.8 4.8 1.6.5 2.9 1.9 2.9 3.6 0 1.9-1.5 3.5-3.3 3.7.4 1.2.1 2.5-.9 3.3-1.2 1-2.9.9-4 0-1-1-1.3-2.3-1-3.5-1.3 0-2.4-.7-3-1.7-1.3.4-2.8-.3-3.4-1.5-.7-1.6.1-3.5 1.8-4 .1-1.7 1.4-3 3-3.3C9.8 6.8 9.9 6.4 10.2 6c1.3.4 3 .7 3.8 0z' fill='%23FFD28A'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600&family=ZCOOL+KuaiLe&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- 纸面颗粒：程序化噪点纹理（非渐变） -->
      <filter id="grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch" result="n" />
        <feColorMatrix in="n" type="matrix"
          values="0 0 0 0 0.07
                  0 0 0 0 0.055
                  0 0 0 0 0.04
                  1 0 0 0 0" />
      </filter>
      <filter id="grain-fine" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="23" stitchTiles="stitch" result="n" />
        <feColorMatrix in="n" type="matrix"
          values="0 0 0 0 0.05
                  0 0 0 0 0.04
                  0 0 0 0 0.03
                  1 0 0 0 0" />
      </filter>

      <!-- 彩纸纹理底纹 -->
      <pattern id="p-old" width="96" height="96" patternUnits="userSpaceOnUse">
        <rect width="96" height="96" fill="#C98A4B" />
        <rect width="96" height="96" filter="url(#grain)" />
      </pattern>
      <pattern id="p-paperlight" width="96" height="96" patternUnits="userSpaceOnUse">
        <rect width="96" height="96" fill="#E8D5B0" />
        <rect width="96" height="96" filter="url(#grain)" />
      </pattern>
      <pattern id="p-moss" width="96" height="96" patternUnits="userSpaceOnUse">
        <rect width="96" height="96" fill="#7A8B5C" />
        <rect width="96" height="96" filter="url(#grain)" />
      </pattern>
      <pattern id="p-scrap" width="96" height="96" patternUnits="userSpaceOnUse">
        <rect width="96" height="96" fill="#C08A4E" />
        <rect width="96" height="96" filter="url(#grain)" />
      </pattern>
      <pattern id="p-polaroid" width="72" height="72" patternUnits="userSpaceOnUse">
        <rect width="72" height="72" fill="#CFB98C" />
        <rect width="72" height="72" filter="url(#grain-fine)" />
      </pattern>

      <!-- 枫叶轮廓 -->
      <path id="leafPath" d="M118 8
        C146 14 168 34 170 60
        C192 62 208 76 206 94
        C210 108 202 122 186 126
        C190 140 178 154 160 154
        C156 168 138 178 120 174
        C122 192 110 206 92 208
        C70 206 58 190 62 172
        C46 166 40 152 46 140
        C32 134 26 122 32 110
        C22 96 28 82 42 80
        C40 58 56 38 78 32
        C84 16 100 8 118 8 Z" />
      <path id="leafStem" d="M118 176 L124 226" />
      <path id="leafVein" d="M118 16 C118 70 118 120 118 172" />

      <!-- 月牙 -->
      <path id="moonPath" d="M124 22
        A70 70 0 1 0 178 132
        A58 58 0 0 1 124 22 Z" />

      <!-- 票据撕边 -->
      <path id="scrapPath" d="M0 0 H156 V138
        L148 148 L141 140 L134 148 L127 140 L120 148 L113 140
        L106 148 L99 140 L92 148 L85 140 L78 148 L71 140 L64 148
        L57 140 L50 148 L43 140 L36 148 L29 140 L22 148 L15 140 L8 148 L0 142 Z" />
    </defs>
  </svg>

  <div class="app" id="app">
    <!-- ═══ 顶栏 56px ═══ -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="26" height="26">
            <path d="M14 4c3.6 1 6 3.4 6.6 6.6 2.2.7 4 2.6 4 5 0 2.6-2 4.8-4.5 5.1.6 1.6.2 3.4-1.2 4.5-1.7 1.4-4.1 1.3-5.7 0-1.3-1-1.8-2.7-1.3-4.3-1.8 0-3.4-.9-4.2-2.4-1.9.5-3.9-.4-4.7-2.1-1-2.2.1-4.8 2.5-5.6.2-2.3 1.9-4.1 4.2-4.4C13.6 5 13.7 4.6 14 4z" fill="var(--lamp)" opacity="0.92" />
          </svg>
        </span>
        <span class="brand-name">pasteup</span>
        <span class="brand-sub">深夜拼贴桌</span>
      </div>

      <div class="topbar-center">
        <span class="doc-title">夜 · 拼贴本</span>
        <span class="saved-dot" title="已自动保存" aria-label="已自动保存"></span>
        <span class="saved-text">已保存</span>
      </div>

      <div class="topbar-right">
        <div class="lamp-toggle-wrap">
          <button class="lamp-toggle" id="lampToggle" role="switch" aria-checked="true" aria-label="台灯开关">
            <span class="lamp-toggle-track">
              <span class="lamp-toggle-knob" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="13" height="13" class="lamp-icon lamp-icon-on">
                  <path d="M8 1.6c.4 2 .2 3-.4 4.2-.5 1-.4 1.8.3 2.6h2.1c.5.6.8 1.4.7 2.3-1.9.6-4.3.6-6.2 0-.1-.9.2-1.7.7-2.3h2.1c.7-.8.8-1.6.3-2.6-.6-1.2-.8-2.2-.4-4.2z" fill="#2B241C" />
                  <rect x="6.2" y="11.4" width="3.6" height="1.2" rx="0.5" fill="#2B241C" />
                </svg>
                <svg viewBox="0 0 16 16" width="13" height="13" class="lamp-icon lamp-icon-off">
                  <circle cx="8" cy="8" r="3.4" fill="none" stroke="#2B241C" stroke-width="1.6" />
                  <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="#2B241C" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </span>
            </span>
            <span class="lamp-toggle-label" id="lampToggleLabel">台灯</span>
          </button>
        </div>

        <button class="btn btn-ghost" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
            <path d="M10 3v9m0 0 3.4-3.4M10 12 6.6 8.6M4 15.5c1.8 1.4 3.8 2 6 2s4.2-.6 6-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none" />
          </svg>
          <span>分享</span>
        </button>

        <button class="btn btn-primary" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
            <path d="M4 13.5 10 17l6-3.5M10 17V9M4 6.5 10 3l6 3.5L10 10 4 6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none" />
          </svg>
          <span>导出 PNG / SVG</span>
        </button>
      </div>
    </header>

    <!-- ═══ 主区 ═══ -->
    <div class="shell">
      <!-- 左栏 260px -->
      <aside class="left" aria-label="工具栏">
        <section class="panel tools-panel" aria-labelledby="tools-heading">
          <h2 class="panel-title" id="tools-heading">工具</h2>
          <ul class="tools">
            <li><button class="tool active" type="button" aria-pressed="true">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M5 5l10 4-4.4 1.1L9.5 15 5 5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
              <span class="tool-name">选择</span><kbd class="tool-key">V</kbd>
            </button></li>
            <li><button class="tool" type="button" aria-pressed="false">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M4 16c1.5-4.6 4-7.4 7.5-10.5C12.8 4.2 14.5 4.4 15 5.4c.7 1.3-.4 2.2-1.2 2.9-2.6 2.3-5.4 4.6-7.6 6.4L4 16z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
              <span class="tool-name">描摹</span><kbd class="tool-key">B</kbd>
            </button></li>
            <li><button class="tool" type="button" aria-pressed="false">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h7A2.5 2.5 0 0 1 16 6.5v7a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 4 13.5v-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.5c.8.8 1.2 1.8 1.2 3.5s-.4 2.7-1.2 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
              <span class="tool-name">纸片</span><kbd class="tool-key">P</kbd>
            </button></li>
            <li><button class="tool" type="button" aria-pressed="false">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><rect x="3.5" y="4.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="9" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 15l3.6-3.6a1 1 0 0 1 1.4 0l4.4 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
              <span class="tool-name">底图</span><kbd class="tool-key">I</kbd>
            </button></li>
            <li><button class="tool" type="button" aria-pressed="false">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M5 4.5h7.5l2 2.6 3.5 3.9H4.5A2 2 0 0 1 5 4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4.5 11h12l1.5 2.4a2 2 0 0 1-1.7 3.1H4.7a2 2 0 0 1-1.7-3.1L4.5 11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
              <span class="tool-name">纹理</span><kbd class="tool-key">T</kbd>
            </button></li>
            <li><button class="tool" type="button" aria-pressed="false">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><circle cx="13" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 16l4.4-7 3 4.4L15 9.4 17 13v3H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
              <span class="tool-name">着色</span><kbd class="tool-key">C</kbd>
            </button></li>
            <li><button class="tool" type="button" aria-pressed="false">
              <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M4 6h6M14 6h2M4 10h4M12 10h4M4 14h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="13.5" y="4.5" width="4" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
              <span class="tool-name">拼贴</span><kbd class="tool-key">J</kbd>
            </button></li>
          </ul>
        </section>

        <section class="panel layers-panel" aria-labelledby="layers-heading">
          <h2 class="panel-title" id="layers-heading">图层</h2>
          <ul class="layers">
            <li class="layer selected">
              <span class="layer-chip chip-old" aria-hidden="true"></span>
              <span class="layer-name">纸片 · 枫叶</span>
              <button class="layer-ctrl" type="button" aria-label="锁定 纸片·枫叶" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <button class="layer-ctrl" type="button" aria-label="隐藏 纸片·枫叶" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M1.8 8s2.2-4.2 6.2-4.2S14.2 8 14.2 8 12 12.2 8 12.2 1.8 8 1.8 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
            </li>
            <li class="layer">
              <span class="layer-chip chip-light" aria-hidden="true"></span>
              <span class="layer-name">纸片 · 月</span>
              <button class="layer-ctrl" type="button" aria-label="锁定 纸片·月" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <button class="layer-ctrl" type="button" aria-label="隐藏 纸片·月" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M1.8 8s2.2-4.2 6.2-4.2S14.2 8 14.2 8 12 12.2 8 12.2 1.8 8 1.8 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
            </li>
            <li class="layer">
              <span class="layer-chip chip-polaroid" aria-hidden="true"></span>
              <span class="layer-name">底图 · 夜色照片</span>
              <button class="layer-ctrl" type="button" aria-label="锁定 底图·夜色照片" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <button class="layer-ctrl" type="button" aria-label="隐藏 底图·夜色照片" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M1.8 8s2.2-4.2 6.2-4.2S14.2 8 14.2 8 12 12.2 8 12.2 1.8 8 1.8 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
            </li>
          </ul>
        </section>

        <div class="night-note" aria-hidden="true">
          <span class="night-note-time">凌晨 1:23</span>
          <span class="night-note-line"></span>
          <span class="night-note-msg">夜深了，继续拼</span>
        </div>
      </aside>

      <!-- 画布 -->
      <main class="canvas" id="canvas" aria-label="拼贴画布">
        <div class="stage" id="stage">
          <div class="wood" aria-hidden="true"></div>

          <!-- 底图 · 夜色照片（宝丽来） -->
          <figure class="paper paper-polaroid" data-lit="0" data-w="176" data-h="204" tabindex="0" role="img" aria-label="夜色照片底图">
            <svg viewBox="0 0 176 204" class="paper-svg">
              <rect x="1.5" y="1.5" width="173" height="201" rx="4" fill="url(#p-polaroid)" stroke="rgba(20,14,8,0.35)" stroke-width="3" />
              <rect x="14" y="14" width="148" height="128" rx="2" fill="#141B26" />
            </svg>
            <figcaption class="paper-caption">拍于 23:47 · 湖边</figcaption>
            <canvas class="night-photo" width="148" height="128" aria-hidden="true"></canvas>
          </figure>

          <!-- 纸片 · 枫叶（台灯光锥中心） -->
          <figure class="paper paper-leaf selected" data-lit="1" data-w="210" data-h="238" tabindex="0" role="img" aria-label="纸片 枫叶，旧纸纹理">
            <svg viewBox="0 0 220 240" class="paper-svg">
              <use href="#leafPath" fill="url(#p-old)" />
              <use href="#leafPath" fill="none" stroke="rgba(30,20,8,0.35)" stroke-width="2" />
              <use href="#leafStem" fill="none" stroke="#8C5E2B" stroke-width="5" stroke-linecap="round" />
              <use href="#leafVein" fill="none" stroke="rgba(90,58,22,0.5)" stroke-width="2.4" stroke-linecap="round" />
              <use href="#leafPath" class="sel-outline" fill="none" stroke="var(--lamp)" stroke-width="1.6" stroke-dasharray="7 6" />
            </svg>
            <span class="sel-handle sel-handle-nw" aria-hidden="true"></span>
            <span class="sel-handle sel-handle-ne" aria-hidden="true"></span>
            <span class="sel-handle sel-handle-sw" aria-hidden="true"></span>
            <span class="sel-handle sel-handle-se" aria-hidden="true"></span>
            <span class="sel-rotate" aria-hidden="true"></span>
          </figure>

          <!-- 纸片 · 月（光锥边缘） -->
          <figure class="paper paper-moon" data-lit="0.6" data-w="150" data-h="150" tabindex="0" role="img" aria-label="纸片 月，纸面高光纹理">
            <svg viewBox="0 0 200 200" class="paper-svg">
              <use href="#moonPath" fill="url(#p-paperlight)" />
              <use href="#moonPath" fill="none" stroke="rgba(30,20,8,0.28)" stroke-width="2.4" />
            </svg>
            <span class="paper-shine" aria-hidden="true"></span>
          </figure>

          <!-- 纸片 · 票据（光锥外，沉入暗处） -->
          <figure class="paper paper-scrap" data-lit="0.08" data-w="156" data-h="150" tabindex="0" role="img" aria-label="纸片 票据，旧收据">
            <svg viewBox="0 0 156 150" class="paper-svg">
              <use href="#scrapPath" fill="url(#p-scrap)" />
            </svg>
            <span class="paper-hand">0:12 便利店 · 热牛奶</span>
          </figure>

          <!-- 手写注记（桌面便利贴） -->
          <div class="note note-a" aria-hidden="true">光下的旧纸最好看</div>
          <div class="note note-b" aria-hidden="true">把月亮贴在灯下</div>

          <!-- 桌角杂物：铅笔 + 咖啡渍 -->
          <div class="coffee-ring" aria-hidden="true"></div>
          <svg viewBox="0 0 220 22" class="pencil" aria-hidden="true">
            <path d="M6 10 192 4l20 8-186 6L6 10z" fill="#A8763F" stroke="#241A10" stroke-width="1.2" />
            <rect x="188" y="5" width="30" height="8" rx="3" fill="#C98A4B" stroke="#241A10" stroke-width="1" />
            <path d="M212 6.5 218 9l-2 4-4-2z" fill="#2A2118" />
            <rect x="12" y="9.4" width="168" height="1.4" fill="rgba(90,58,22,0.55)" />
          </svg>

          <!-- 台灯 + 光锥 -->
          <svg viewBox="0 0 400 220" class="lamp-arm" aria-hidden="true">
            <path d="M30 12 C 96 16 128 26 168 44" fill="none" stroke="#211A13" stroke-width="11" stroke-linecap="round" />
            <path d="M30 12 C 96 16 128 26 168 44" fill="none" stroke="#3A2C1E" stroke-width="7" stroke-linecap="round" />
            <path d="M262 8 C 216 6 190 12 172 26" fill="none" stroke="#211A13" stroke-width="11" stroke-linecap="round" />
            <path d="M262 8 C 216 6 190 12 172 26" fill="none" stroke="#3A2C1E" stroke-width="7" stroke-linecap="round" />
            <path d="M172 26 C 168 40 168 52 172 64" fill="none" stroke="#211A13" stroke-width="9" stroke-linecap="round" />
          </svg>
          <svg viewBox="0 0 120 120" class="lamp-head" aria-hidden="true">
            <path d="M18 88 C 26 60 42 46 62 40 C 72 37 84 37 92 44 C 74 62 50 74 24 92 C 22 90 20 89 18 88 Z" fill="#3A2C1E" />
            <path d="M20 88 C 30 92 40 96 50 100 L 44 108 L 26 100 Z" fill="#3A2C1E" />
            <ellipse cx="66" cy="50" rx="34" ry="22" fill="var(--lamp)" class="lamp-bulb" transform="rotate(-22 66 50)" />
            <ellipse cx="66" cy="50" rx="34" ry="22" fill="none" stroke="#4C3A26" stroke-width="4" transform="rotate(-22 66 50)" />
          </svg>
          <div class="light-cone" id="lightCone" aria-hidden="true"></div>

          <div class="vignette" aria-hidden="true"></div>
          <div class="canvas-hud" aria-hidden="true">
            <span class="hud-zoom">100%</span>
          </div>
        </div>
      </main>

      <!-- 右栏 280px -->
      <aside class="right" aria-label="属性面板">
        <section class="panel swatch-panel" aria-labelledby="swatch-heading">
          <h2 class="panel-title" id="swatch-heading">色板</h2>
          <ul class="swatches">
            <li class="swatch">
              <span class="swatch-chip" style="--sw:#2B241C"></span>
              <span class="swatch-name">深夜桌</span>
            </li>
            <li class="swatch selected">
              <span class="swatch-chip" style="--sw:#FFD28A"></span>
              <span class="swatch-name">台灯暖光</span>
              <svg class="swatch-check" viewBox="0 0 14 14" width="13" height="13" aria-hidden="true"><path d="M3 7.4 6 10.2 11 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </li>
            <li class="swatch">
              <span class="swatch-chip" style="--sw:#C98A4B"></span>
              <span class="swatch-name">旧纸</span>
            </li>
            <li class="swatch">
              <span class="swatch-chip" style="--sw:#7A8B5C"></span>
              <span class="swatch-name">暗苔绿</span>
            </li>
            <li class="swatch">
              <span class="swatch-chip" style="--sw:#E8D5B0"></span>
              <span class="swatch-name">纸面高光</span>
            </li>
            <li class="swatch">
              <span class="swatch-chip" style="--sw:#1E1912"></span>
              <span class="swatch-name">最深暗</span>
            </li>
          </ul>
        </section>

        <section class="panel texture-panel" aria-labelledby="texture-heading">
          <h2 class="panel-title" id="texture-heading">纹理</h2>
          <ul class="textures">
            <li class="texture selected"><span class="tex-chip tex-old" aria-hidden="true"></span><span class="tex-name">旧纸</span></li>
            <li class="texture"><span class="tex-chip tex-fiber" aria-hidden="true"></span><span class="tex-name">纤维</span></li>
            <li class="texture"><span class="tex-chip tex-grain" aria-hidden="true"></span><span class="tex-name">颗粒</span></li>
            <li class="texture"><span class="tex-chip tex-wash" aria-hidden="true"></span><span class="tex-name">水彩</span></li>
            <li class="texture"><span class="tex-chip tex-cloth" aria-hidden="true"></span><span class="tex-name">布纹</span></li>
          </ul>
        </section>

        <section class="panel props-panel" aria-labelledby="props-heading">
          <h2 class="panel-title" id="props-heading">属性 <span class="props-for">纸片 · 枫叶</span></h2>
          <dl class="props">
            <div class="prop">
              <dt>纸片类型</dt>
              <dd class="prop-val">彩纸 · 旧纸</dd>
            </div>
            <div class="prop">
              <dt>透明度</dt>
              <dd class="prop-slider"><input id="range-op" type="range" min="0" max="100" value="100" aria-label="透明度" /><span class="prop-num" id="opNum">100%</span></dd>
            </div>
            <div class="prop">
              <dt>旋转</dt>
              <dd class="prop-slider"><input id="range-rot" type="range" min="-180" max="180" value="12" aria-label="旋转" /><span class="prop-num" id="rotNum">12°</span></dd>
            </div>
            <div class="prop">
              <dt>明度</dt>
              <dd class="prop-slider"><input id="range-bri" type="range" min="20" max="160" value="104" aria-label="明度" /><span class="prop-num" id="briNum">104</span></dd>
            </div>
            <div class="prop">
              <dt>光照响应</dt>
              <dd class="prop-toggle">
                <button class="mini-switch" id="lightResp" role="switch" aria-checked="true" aria-label="光照响应">
                  <span class="mini-switch-track"><span class="mini-switch-knob" aria-hidden="true"></span></span>
                </button>
                <span class="prop-num" id="lightRespLabel">灯下会亮</span>
              </dd>
            </div>
          </dl>
          <p class="props-hint">勾选「光照响应」后，纸片会随台灯光锥的方向亮起、离开光则沉入夜色。</p>
        </section>
      </aside>
    </div>
  </div>

  <div class="live-status" id="liveStatus" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
